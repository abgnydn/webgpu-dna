<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- Phase A -->
  <rect x="24" y="60" width="210" height="150" rx="8" fill="#eaf1f1" stroke="#1f7a7a" stroke-width="1.5"/>
  <text x="129" y="84" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Phase A — primaries</text>
  <text x="129" y="104" font-size="11" fill="#225" text-anchor="middle">ONE fused @compute dispatch</text>
  <text x="129" y="120" font-size="11" fill="#225" text-anchor="middle">1 thread / primary electron</text>
  <text x="129" y="142" font-size="10.5" fill="#456" text-anchor="middle">full history in a for-loop:</text>
  <text x="129" y="157" font-size="10.5" fill="#456" text-anchor="middle">Born ion. · Emfietzoglou exc.</text>
  <text x="129" y="172" font-size="10.5" fill="#456" text-anchor="middle">elastic · vibrational</text>
  <text x="129" y="196" font-size="10" fill="#1f7a7a" text-anchor="middle" font-style="italic">no per-step dispatch (fused)</text>
  <!-- Phase B -->
  <rect x="275" y="60" width="200" height="150" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="375" y="84" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">Phase B — secondaries</text>
  <text x="375" y="104" font-size="11" fill="#225" text-anchor="middle">wavefront stepper</text>
  <text x="375" y="120" font-size="11" fill="#225" text-anchor="middle">1 dispatch / physics step</text>
  <text x="375" y="142" font-size="10.5" fill="#456" text-anchor="middle">advances all live secondaries</text>
  <text x="375" y="196" font-size="10" fill="#b45309" text-anchor="middle" font-style="italic">cannot fuse: count unknown</text>
  <text x="375" y="210" font-size="10" fill="#b45309" text-anchor="middle" font-style="italic">until A completes</text>
  <!-- Phase C -->
  <rect x="516" y="60" width="220" height="150" rx="8" fill="#f3eefb" stroke="#6b21a8" stroke-width="1.5"/>
  <text x="626" y="84" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Phase C — chemistry</text>
  <text x="626" y="104" font-size="11" fill="#225" text-anchor="middle">Karamitros 9-reaction IRT</text>
  <text x="626" y="120" font-size="11" fill="#225" text-anchor="middle">Web Worker (off main thread)</text>
  <text x="626" y="142" font-size="10.5" fill="#456" text-anchor="middle">6 species · Smoluchowski +</text>
  <text x="626" y="157" font-size="10.5" fill="#456" text-anchor="middle">Onsager-screened reactions</text>
  <text x="626" y="196" font-size="10" fill="#6b21a8" text-anchor="middle" font-style="italic">CPU-bound (the bottleneck)</text>
  <!-- arrows -->
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker></defs>
  <line x1="234" y1="135" x2="273" y2="135" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="475" y1="135" x2="514" y2="135" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- buffers row -->
  <rect x="24" y="238" width="451" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="249" y="255" font-size="10.5" fill="#334" text-anchor="middle" font-weight="600">shared GPU buffers: rad_buf (energy deposits) · secondary buffer</text>
  <text x="249" y="270" font-size="10" fill="#556" text-anchor="middle">1283 voxel grid · fixed-point integer atomicAdd (×100/eV)</text>
  <rect x="516" y="238" width="220" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="626" y="262" font-size="10.5" fill="#334" text-anchor="middle">radical list → G-values, SSB/DSB</text>
  <line x1="129" y1="210" x2="129" y2="236" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="375" y1="210" x2="375" y2="236" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="626" y1="210" x2="626" y2="236" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
</svg>
