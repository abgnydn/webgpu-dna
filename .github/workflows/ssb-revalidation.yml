name: SSB revalidation (IRT + scoring)

# Runs the IRT chemistry WITH SSB/DSB scoring (tools/run_irt_ssb.cjs) on a
# rad_buf dump, on a 16 GB runner. GPU-free (the dump is the WebGPU output).
# Used to revalidate the strand-break endpoints after a shader change — e.g.
# RECOMB_BOOST 2.0->1.0 (E7d), where SSB_P_INDIRECT was calibrated at 2.0 and
# the indirect/direct ratio must be re-checked against PARTRAC's 2-3 band.

on:
  workflow_dispatch:
    inputs:
      dump:
        description: "dump asset name on validation-inputs-v1"
        type: string
        default: "rad_E10000_recomb1.bin"
      energy:
        description: "primary energy in eV"
        type: string
        default: "10000"
      label:
        description: "label for the result artifact"
        type: string
        default: "recomb1"

permissions:
  contents: read

jobs:
  ssb:
    name: SSB/DSB @ ${{ inputs.energy }} eV (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DUMP: ${{ inputs.dump }}
      ENERGY: ${{ inputs.energy }}
      LABEL: ${{ inputs.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runner memory
        run: |
          free -h
          echo "cores $(nproc)"
      - name: Download dump
        run: |
          mkdir -p dumps ci-results
          gh release download validation-inputs-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "$DUMP" --dir dumps --clobber
          ls -la "dumps/$DUMP"
      - name: Run IRT + SSB/DSB scoring (13 GB heap)
        run: |
          node --max-old-space-size=13000 tools/run_irt_ssb.cjs \
            "dumps/$DUMP" 4096 "$ENERGY" \
            > "ci-results/ssb_${LABEL}_E${ENERGY}.json"
          echo "--- result ---"; cat "ci-results/ssb_${LABEL}_E${ENERGY}.json"
      - name: Compare to E41 shipped baseline (fail on regression)
        # E41 (shipped explicit OH+deoxyribose default, 10 keV dump):
        # SSB_dir=32 SSB_ind=73 DSB=15 ratio=2.281. Bands are regression
        # tripwires for the scoring toolchain, not physics pass bars — the
        # ratio itself is a prediction, so band position vs PARTRAC is
        # reported, never gated. Non-default dump/energy runs are
        # informational (no baseline to compare against).
        run: |
          node -e "
            const fs = require('fs');
            const f = 'ci-results/ssb_${{ inputs.label }}_E${{ inputs.energy }}.json';
            const r = JSON.parse(fs.readFileSync(f, 'utf8'));
            console.log('result:', JSON.stringify({ ssb_dir: r.ssb_dir, ssb_ind: r.ssb_ind, dsb: r.dsb, ratio: r.indirect_over_direct_ratio }));
            if ('${{ inputs.dump }}' !== 'rad_E10000_recomb1.bin' || '${{ inputs.energy }}' !== '10000') {
              console.log('non-default dump/energy — informational only, no gate');
              process.exit(0);
            }
            const fails = [];
            const band = (name, got, want, tol) => {
              const lo = Math.min(want * (1 - tol), want - 3), hi = Math.max(want * (1 + tol), want + 3);
              if (!(got >= lo && got <= hi)) fails.push(name + ' got ' + got + ', want ' + want + ' ±' + Math.round(tol * 100) + '%');
            };
            band('SSB_dir', r.ssb_dir, 32, 0.25);
            band('SSB_ind', r.ssb_ind, 73, 0.25);
            band('DSB', r.dsb, 15, 0.25);
            if (r.ssb_dir > 0) {
              const ratio = r.ssb_ind / r.ssb_dir;
              if (Math.abs(ratio - 2.281) / 2.281 > 0.15) fails.push('ratio got ' + ratio.toFixed(3) + ', want 2.281 ±15%');
              console.log('PARTRAC 2-3 band position (informational):', ratio >= 2 && ratio <= 3 ? 'IN' : 'OUT');
            }
            if (fails.length) { console.error('SSB REGRESSION: ' + fails.join('; ')); process.exit(1); }
            console.log('SSB revalidation within E41 baseline bands ✓');
          "
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ssb-${{ inputs.label }}-E${{ inputs.energy }}
          path: ci-results/ssb_${{ inputs.label }}_E${{ inputs.energy }}.json
          if-no-files-found: error
